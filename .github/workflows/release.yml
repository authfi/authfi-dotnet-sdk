# Publishes the package to NuGet when a version tag (vX.Y.Z) is pushed. NuGet trusts this workflow by OpenID
# Connect (trusted publishing): the NuGet/login step trades the workflow's identity for a short-lived API key, so
# no long-lived key is stored in GitHub. The trusted publishing policy on nuget.org names this repository, this
# file and the `nuget` environment, so a copy of the workflow elsewhere cannot publish. The `nuget` environment
# needs a reviewer's approval before the publish job starts, and holds one variable, NUGET_USER: the nuget.org
# account that owns the package.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Built and tested without the publishing permission, so nothing the build runs can obtain a NuGet credential.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag on the wrong commit must fail here: a version on NuGet can be unlisted but never replaced.
      - name: The tag is a version on main, with a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a version tag (vMAJOR.MINOR.PATCH)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          v="${TAG#v}"
          [ "$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' AuthFI.csproj)" = "$v" ] || { echo "::error::AuthFI.csproj version is not $v"; exit 1; }
          grep -Eq "^## \[?${v//./\\.}\]?( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build AuthFI.csproj -c Release -warnaserror
      - run: dotnet test tests/AuthFI.Tests -c Release
      - run: dotnet pack AuthFI.csproj -c Release -p:ContinuousIntegrationBuild=true -o out
      - name: The package is the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls out
          test -f "out/AuthFI.${TAG#v}.nupkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/AuthFI
    permissions:
      contents: read
      id-token: write # NuGet/login exchanges this OIDC token for a short-lived API key
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: out/
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*nupkg
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      # The package built above, not a rebuild. No --skip-duplicate: pushing a version that exists must fail loudly.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
